# Configuration for Perturb-and-MAP training
model:
  n_visible: 784
  n_hidden: 128
  model_type: rbm

training:
  epochs: 10
  learning_rate: 0.1
  batch_size: 1
  batch_limit: 100  # Set to integer to limit batches per epoch (useful for testing)
  optimizer: sgd
  checkpoint_every: 1
  checkpoint_path: rbm_pm_checkpoint.pth
  method: perturb_map

cd_params:
  k_steps: 1
  persistent: false
  use_momentum: false
  momentum: 0.5
  temperature: 1.0
  seed: 42

pm_params:
  gumbel_scale: 1.0
  solver_timeout: 60.0
  max_retries: 3
  seed: 42

data:
  dataset: mnist
  digit_filter: null
  image_size: [28, 28]
  data_root: ./data
  train_split: true
  download: true

solver:
  name: hexaly
  time_limit: 0.5
  suppress_output: true
  num_samples: 10
  relaxation_schedule: 1

inference:
  method: qubo  # 'qubo' or 'gibbs' - inference method selection
  qubo_solver: hexaly  # QUBO solver for inference (can differ from training)
  time_limit: 10.0  # solver timeout for inference (separate from training config)
  gibbs_steps: 1000  # for gibbs inference method
  num_generated_samples: 10
  reconstruction_samples: 5

logging:
  log_file: pm_training.log
  save_plots: true
  plot_every: 5
  figures_dir: ./figures